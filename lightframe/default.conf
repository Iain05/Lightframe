map $http_user_agent $is_crawler {
    default 0;
    "~*discordbot|slackbot|twitterbot|facebookexternalhit|telegrambot|whatsapp|linkedinbot|redditbot|embedly|pinterest|skypeuripreview|bsky|mastodon|iframely|google-structured-data-testing-tool" 1;
}

server {

    listen 80;

    server_name iaingriesdale.com www.iaingriesdale.com _;

    root /usr/share/nginx/html;

    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Point bot crawlers at a custom endpoint to return custom html for Open Graph
    location ~ ^/album/(?<album_id>[^/]+)/?$ {
        if ($is_crawler) {
            rewrite ^ /_og/album/$album_id last;
        }
        try_files $uri /index.html;
    }

    # Internal only: reachable via the rewrite above, not from the outside.
    location ~ ^/_og/album/(?<og_album_id>[^/]+)$ {
        internal;
        proxy_pass http://backend:8080/api/og/album/$og_album_id;
        proxy_set_header Host $host;
    }

    location /photos-proxy/ {
        proxy_pass https://photos.iaingriesdale.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host photos.iaingriesdale.com;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;

        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        client_max_body_size 30M;
    }
}

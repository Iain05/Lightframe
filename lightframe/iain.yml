name: Iain Griesdale
about:
  - My name is Iain Griesdale, I am a Computer Engineering student at the University of British Columbia, and member of the VEXU Robotics Team <a href='https://tntnvex.com'>TNTN</a>.
  - Most of my work is a mix of nature and urban photography, but I really enjoy all types of photography from landscapes to portraits. 
  - I built this website myself over the course of a few weeks, and is still a work in progress. All the code is available on GitHub to see.